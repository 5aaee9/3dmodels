name: OpenSCAD lint

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openscad-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Check OpenSCAD models
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends openscad
          openscad --version

      - name: Lint OpenSCAD models
        run: python scripts/lint_scad.py
